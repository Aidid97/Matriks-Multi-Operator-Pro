<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matrix Protocol Engine</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --line: #374151;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --blue: #60a5fa;
      --green: #34d399;
      --gold: #fbbf24;
      --red: #f87171;
      --purple: #c084fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #0b1220, #111827);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .date-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .date-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
    }

    .date-box label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .date-box input {
      background: #0b1220;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    .seed-box {
      background: #0b1220;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      width: 170px;
      outline: none;
    }

    .button {
      border: none;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .button:hover { transform: translateY(-1px); opacity: 0.96; }
    .button:active { transform: translateY(0); }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }

    .panel-header {
      background: #0b1220;
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .matrix {
      display: grid;
      gap: 8px;
      padding: 14px;
    }

    .matrix-4x4 { grid-template-columns: repeat(4, minmax(100px, 1fr)); }
    .matrix-3x3 { grid-template-columns: repeat(3, minmax(100px, 1fr)); }

    .cell {
      min-height: 78px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #111827, #0f172a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      gap: 4px;
      color: var(--text);
    }

    .tag {
      font-size: 0.54rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .number {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--green);
    }

    .status-bar {
      margin-top: 18px;
      background: #0b1220;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 120px;
    }

    .status-title {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .final-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--green);
      line-height: 1.6;
      word-wrap: break-word;
    }

    @media (max-width: 760px) {
      .content { grid-template-columns: 1fr; }
      .matrix-4x4, .matrix-3x3 { grid-template-columns: repeat(2, minmax(110px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">PROTOKOL ANALISIS MATRIK</div>

      <div class="date-row">
        <div class="date-box">
          <label for="startDate">Tarikh Mula</label>
          <input id="startDate" type="date" />
        </div>

        <div class="date-box">
          <label for="endDate">Tarikh Tamat</label>
          <input id="endDate" type="date" />
        </div>

        <div class="date-box">
          <label for="matrixSeed4x4">Nilai 4x4</label>
          <input id="matrixSeed4x4" class="seed-box" type="text" placeholder="6204" value="" />
        </div>

        <div class="date-box">
          <label for="matrixSeed3x3">Nilai 3x3</label>
          <input id="matrixSeed3x3" class="seed-box" type="text" placeholder="620" value="" />
        </div>

        <button class="button" id="generateBtn">Generate</button>
      </div>
    </div>

    <div class="content">
      <div class="panel">
        <div class="panel-header">Carta Matrix 4x4</div>
        <div class="matrix matrix-4x4" id="matrix4x4"></div>
      </div>

      <div class="panel">
        <div class="panel-header">Carta Matrix 3x3</div>
        <div class="matrix matrix-3x3" id="matrix3x3"></div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-title">Status Protokol</div>
      <div class="final-text" id="finalStatus">Menunggu analisis...</div>
    </div>
  </div>

  <script>
    function sanitizeDigits(value, length) {
      const digits = String(value ?? '').replace(/\D/g, '');
      if (!digits) return '';
      return digits.slice(0, length);
    }

    function digitsOf(value, length = 4) {
      const cleaned = sanitizeDigits(value, length);
      return cleaned.padStart(length, '0').slice(0, length).split('').map(Number);
    }

    function getAutoSeedFromDate(dateValue, mode) {
      const raw = dateValue || new Date().toISOString().split('T')[0];
      const [year, month, day] = raw.split('-');

      const yy = Number(String(year || '2026').slice(-2));
      const mm = Number(month || '1');
      const dd = Number(day || '1');

      const a = (yy + mm + dd) % 10;
      const b = (mm + dd) % 10;
      const c = (yy + dd) % 10;

      if (mode === '4x4') {
        return `${dd}${a}${b}${c}`.slice(0, 4).padStart(4, '0');
      }

      if (mode === '3x3') {
        return `${a}${b}${c}`.slice(0, 3).padStart(3, '0');
      }

      return '';
    }

    function resolveSeed(inputId, mode, dateValue) {
      const input = document.getElementById(inputId);
      const manual = sanitizeDigits(input?.value || '', mode === '4x4' ? 4 : 3);
      if (manual) return manual.padStart(mode === '4x4' ? 4 : 3, '0');
      return getAutoSeedFromDate(dateValue, mode);
    }

    function buildMatrix4x4(seed) {
      const digits = digitsOf(seed, 4);
      const matrix = [digits.slice()];
      for (let r = 1; r < 4; r++) {
        const row = [];
        for (let c = 0; c < 4; c++) {
          row.push((matrix[r - 1][c] + 1) % 10);
        }
        matrix.push(row);
      }
      return matrix;
    }

    function buildMatrix3x3(seed) {
      const digits = digitsOf(seed, 3);
      const matrix = [digits.slice()];
      for (let r = 1; r < 3; r++) {
        const row = [];
        for (let c = 0; c < 3; c++) {
          row.push((matrix[r - 1][c] + 2) % 10);
        }
        matrix.push(row);
      }
      return matrix;
    }

    function getFrequency(results) {
      const map = new Map();
      for (const value of results) {
        const digits = digitsOf(value, 4);
        for (const digit of digits) {
          map.set(digit, (map.get(digit) || 0) + 1);
        }
      }
      return map;
    }

    function makeStatusText(freqMap, matrix4x4, matrix3x3) {
      const sortedDigits = [...freqMap.entries()].sort((a, b) => b[1] - a[1]);
      const top = sortedDigits[0] ? sortedDigits[0][0] : 0;
      const score4 = matrix4x4.flat().reduce((sum, v) => sum + v, 0);
      const score3 = matrix3x3.flat().reduce((sum, v) => sum + v, 0);
      return `Tarikh digunakan untuk auto-seed. Digit utama pada zon ${top}. Skor matrix 4x4 = ${score4}, matrix 3x3 = ${score3}. Protokol aktif: normalize → frequency → matrix → geometry → trajectory → weighted ranking.`;
    }

    function renderMatrix(targetId, matrix) {
      const target = document.getElementById(targetId);
      if (!target) return;

      target.innerHTML = '';
      matrix.forEach((row, rowIndex) => {
        row.forEach((cellValue, colIndex) => {
          const cell = document.createElement('div');
          cell.className = 'cell';

          const tag = document.createElement('div');
          tag.className = 'tag';
          tag.textContent = `${rowIndex + 1}:${colIndex + 1}`;

          const number = document.createElement('div');
          number.className = 'number';
          number.textContent = String(cellValue);

          cell.appendChild(tag);
          cell.appendChild(number);
          target.appendChild(cell);
        });
      });
    }

    function setDefaultDates() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('startDate').value = today;
      document.getElementById('endDate').value = today;
    }

    function renderProtocol() {
      const dateValue = document.getElementById('startDate')?.value || new Date().toISOString().split('T')[0];
      const value4 = resolveSeed('matrixSeed4x4', '4x4', dateValue);
      const value3 = resolveSeed('matrixSeed3x3', '3x3', dateValue);

      const matrix4x4 = buildMatrix4x4(value4);
      const matrix3x3 = buildMatrix3x3(value3);
      const freqMap = getFrequency([value4, value3]);

      renderMatrix('matrix4x4', matrix4x4);
      renderMatrix('matrix3x3', matrix3x3);

      const status = document.getElementById('finalStatus');
      if (status) status.textContent = makeStatusText(freqMap, matrix4x4, matrix3x3);
    }

    document.addEventListener('DOMContentLoaded', () => {
      setDefaultDates();
      document.getElementById('generateBtn').addEventListener('click', renderProtocol);
      document.getElementById('startDate').addEventListener('change', renderProtocol);
      document.getElementById('endDate').addEventListener('change', renderProtocol);
      renderProtocol();
    });
  </script>
</body>
</html>
