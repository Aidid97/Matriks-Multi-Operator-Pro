<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Nombor 2D/3D</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        input[type="number"], input[type="date"], select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        .checkbox-group {
            text-align: left;
            margin: 5px 0 15px 0;
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .checkbox-group label {
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
        }
        .checkbox-group input {
            width: auto;
            margin-right: 10px;
            transform: scale(1.2);
        }
        .btn-jana {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-jana:hover {
            background-color: #218838;
        }
        .btn-reset {
            background-color: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
            padding: 8px;
            font-size: 14px;
        }
        .btn-reset:hover {
            background-color: #c82333;
        }
        .result {
            font-size: 36px;
            font-weight: bold;
            color: #d9534f;
            margin-top: 15px;
            min-height: 40px;
            letter-spacing: 3px;
        }
        .kaunter-teks {
            margin-top: 15px; 
            font-size: 14px; 
            font-weight: bold; 
            color: #555;
            padding: 5px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .statistik {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            font-size: 14px;
        }
        .statistik h4 {
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .statistik ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .statistik li {
            padding: 5px 0;
            border-bottom: 1px dashed #ccc;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Penjana Nombor 2D/3D</h2>
        
        <!-- Pilihan Nombor Asas (Boleh masukkan apa-apa panjang) -->
        <label for="inputNumbers">Masukkan Nombor Asas (Cth: 4D, 5D, 6D):</label>
        <input type="number" id="inputNumbers" placeholder="Cth: 1234 atau 556677" min="0">

        <!-- Pilihan Formula Cermin -->
        <div class="checkbox-group">
            <label>
                <input type="checkbox" id="gunaCermin" checked>
                Guna Formula Cermin (0=5, 1=6...)
            </label>
        </div>

        <label for="inputDate">Masukkan Tarikh (Pilihan):</label>
        <input type="date" id="inputDate">

        <!-- Pilihan Hasil (Dikembalikan kepada 2D/3D sahaja) -->
        <label for="digitType">Pilih Format Hasil Dijana:</label>
        <select id="digitType">
            <option value="2">2D (Dua Digit)</option>
            <option value="3">3D (Tiga Digit)</option>
        </select>
        
        <button class="btn-jana" onclick="generateRandom()">Jana Nombor!</button>
        
        <!-- Bahagian Kaunter & Butang Reset -->
        <p class="kaunter-teks">
            Jumlah Anda Menjana: <span id="kaunterPaparan" style="color: #007bff;">0</span> kali
        </p>
        <button class="btn-reset" onclick="resetData()">Kosongkan Semua Rekod (Reset)</button>

        <p style="margin-top:20px; margin-bottom:5px;">Nombor Bertuah Anda:</p>
        <div class="result" id="resultDisplay">-</div>

        <!-- Bahagian Rekod/Statistik Nombor -->
        <div class="statistik">
            <h4>Rekod Kekerapan Nombor:</h4>
            <ul id="senaraiStatistik">
                <!-- Senarai nombor akan muncul di sini -->
            </ul>
        </div>
    </div>

    <script>
        // Ambil data dari local storage memori telefon
        let jumlahKiraan = parseInt(localStorage.getItem("jumlahJanaanTerkumpul")) || 0;
        let rekodNombor = JSON.parse(localStorage.getItem("rekodNomborTerkumpul")) || {};

        document.getElementById("kaunterPaparan").innerText = jumlahKiraan;
        kemaskiniPaparanStatistik();

        function getMirror(digit) {
            const mirrors = {
                '0': '5', '1': '6', '2': '7', '3': '8', '4': '9',
                '5': '0', '6': '1', '7': '2', '8': '3', '9': '4'
            };
            return mirrors[digit] || digit;
        }

        function kemaskiniPaparanStatistik() {
            let senarai = document.getElementById("senaraiStatistik");
            senarai.innerHTML = ""; 
            
            let adaRekod = false;
            // Loop untuk senaraikan nombor dari storage
            for (let nombor in rekodNombor) {
                adaRekod = true;
                let li = document.createElement("li");
                li.innerHTML = `<span style="font-size:16px; font-weight:bold; color:#d9534f;">${nombor}</span> <span>${rekodNombor[nombor]} kali</span>`;
                senarai.appendChild(li);
            }

            if (!adaRekod) {
                senarai.innerHTML = "<li style='color:#777; justify-content:center; border:none;'>Belum ada nombor dijana.</li>";
            }
        }

        function resetData() {
            let pengesahan = confirm("Padam semula jumlah janaan dan senarai rekod nombor?");
            if (pengesahan) {
                jumlahKiraan = 0;
                rekodNombor = {};
                
                localStorage.removeItem("jumlahJanaanTerkumpul");
                localStorage.removeItem("rekodNomborTerkumpul");
                
                document.getElementById("kaunterPaparan").innerText = jumlahKiraan;
                document.getElementById("resultDisplay").innerText = "-";
                kemaskiniPaparanStatistik();
            }
        }

        function generateRandom() {
            let userInputs = document.getElementById('inputNumbers').value;
            let dateInput = document.getElementById('inputDate').value;
            let digitType = document.getElementById('digitType').value;
            let gunaCermin = document.getElementById('gunaCermin').checked;
            let display = document.getElementById('resultDisplay');

            let pool = "";

            if (userInputs) {
                pool += userInputs; // Masukkan nombor ditaip (4D, 5D, dsb.)
                
                // Tambah nombor cermin hanya jika checkbox ditanda
                if (gunaCermin) {
                    for (let i = 0; i < userInputs.length; i++) {
                        pool += getMirror(userInputs[i]); 
                    }
                }
            }

            if (dateInput) {
                let cleanDate = dateInput.replace(/-/g, ""); // Buang sengkang dari tarikh
                pool += cleanDate;
            }

            // Jika kosong, guna 0-9
            if (!pool) {
                pool = "0123456789";
            }

            let length = parseInt(digitType); // Hanya akan jadi 2 atau 3
            let duration = 1000; 
            let intervalTime = 50; 
            let passedTime = 0;

            // Animasi kocok nombor
            let interval = setInterval(() => {
                let tempNum = "";
                for(let i = 0; i < length; i++) {
                    tempNum += Math.floor(Math.random() * 10);
                }
                display.innerText = tempNum;
                passedTime += intervalTime;

                if (passedTime >= duration) {
                    clearInterval(interval);
                    
                    let finalNum = "";
                    let poolArray = pool.split('');
                    
                    // Janaan keputusan akhir berdasarkan pool input
                    for(let i = 0; i < length; i++) {
                        let randomIndex = Math.floor(Math.random() * poolArray.length);
                        finalNum += poolArray[randomIndex];
                    }
                    display.innerText = finalNum;

                    // Mengemaskini Kaunter Klik
                    jumlahKiraan++;
                    document.getElementById("kaunterPaparan").innerText = jumlahKiraan;
                    localStorage.setItem("jumlahJanaanTerkumpul", jumlahKiraan);

                    // Menyimpan nombor ke dalam Statistik
                    if (rekodNombor[finalNum]) {
                        rekodNombor[finalNum]++;
                    } else {
                        rekodNombor[finalNum] = 1;
                    }
                    localStorage.setItem("rekodNomborTerkumpul", JSON.stringify(rekodNombor));
                    
                    kemaskiniPaparanStatistik();
                }
            }, intervalTime);
        }
    </script>

    <!-- Kod Iklan Adsterra (Social Bar) -->
    <script data-cfasync="false" src="https://bauval.org/14/8ed7ff2149891600bc1774052ca193b4"></script>

</body>
</html>
