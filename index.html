<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Kombinasi Nombor & Cermin</title>
    <style>
        :root {
            --primary: #f5b041;
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.4rem;
            color: var(--primary);
        }

        input[type="number"] {
            width: 80%;
            padding: 12px;
            font-size: 1.5rem;
            text-align: center;
            border-radius: 8px;
            border: 2px solid var(--primary);
            background-color: #1a1a1a;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 5px;
        }
        
        input[type="number"]:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(245, 176, 65, 0.5);
        }

        .instruction {
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-bottom: 15px;
        }

        /* Rekaan kotak semak (checkbox) baharu */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 20px;
            cursor: pointer;
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
        }

        .toggle-container input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .result-box {
            background-color: #000;
            margin: 10px 0 20px 0;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid var(--text-color);
        }

        #number-display {
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: 5px;
            color: var(--primary);
            margin: 0;
            font-family: monospace;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 12px 15px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            flex: 1;
        }

        button:hover {
            background-color: var(--text-color);
            color: var(--card-bg);
        }

        button.btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        button.btn-primary:hover {
            background-color: transparent;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Jana Dari Nombor Pilihan</h1>
        
        <input type="number" id="user-input" placeholder="Cth: 5317" oninput="if(this.value.length > 6) this.value = this.value.slice(0,6);" />
        <div class="instruction">Masukkan nombor rujukan anda</div>

        <!-- Butang pilihan Formula Cermin -->
        <label class="toggle-container">
            <input type="checkbox" id="use-mirror" checked>
            Gunakan Formula Cermin
        </label>
        
        <div class="result-box">
            <p id="number-display">000</p>
        </div>

        <div class="button-group">
            <button onclick="generateFromInput(2)">Jana 2D</button>
            <button class="btn-primary" onclick="generateFromInput(3)">Jana 3D</button>
        </div>
    </div>

    <script>
        function generateFromInput(digits) {
            const inputElement = document.getElementById('user-input');
            const useMirror = document.getElementById('use-mirror').checked;
            
            let userNumbers = inputElement.value.replace(/\D/g, ''); 
            
            if (userNumbers.length === 0) {
                alert('Sila masukkan nombor rujukan anda dahulu.');
                return;
            }

            // Kolam nombor asas
            let pool = userNumbers;
            
            // Tambah nombor cermin ke dalam kolam jika diaktifkan (0=5, 1=6, 2=7, 3=8, 4=9)
            if (useMirror) {
                let mirrorNumbers = '';
                for (let i = 0; i < userNumbers.length; i++) {
                    let digit = parseInt(userNumbers[i]);
                    mirrorNumbers += ((digit + 5) % 10).toString();
                }
                pool += mirrorNumbers;
            }

            const displayElement = document.getElementById('number-display');
            
            // Animasi putaran
            let interval = setInterval(() => {
                let randomAnim = '';
                for(let i = 0; i < digits; i++) {
                    randomAnim += pool[Math.floor(Math.random() * pool.length)];
                }
                displayElement.innerText = randomAnim;
            }, 50);

            // Berhenti animasi dan paparkan nombor muktamad
            setTimeout(() => {
                clearInterval(interval);
                
                // Sistem mengocok (shuffle) kesemua nombor di dalam kolam
                let shuffled = pool.split('').sort(() => 0.5 - Math.random());
                let finalResult = '';
                
                for(let i = 0; i < digits; i++) {
                    // Tarik nombor yang telah dikocok untuk membentuk 2D atau 3D
                    finalResult += shuffled[i % shuffled.length]; 
                }
                
                displayElement.innerText = finalResult;
                
            }, 500);
        }
    </script>

</body>
</html>
