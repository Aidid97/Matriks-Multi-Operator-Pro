<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesin Matriks SportsToto Pro (Python Logic Integration)</title>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #1c1e21; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .container { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); max-width: 500px; width: 100%; }
    h2 { text-align: center; color: #1a365d; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #718096; font-size: 12px; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
    input[type="text"], textarea { width: 100%; padding: 10px; border: 2px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 15px; font-family: monospace; }
    textarea { font-size: 13px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: #3182ce; }
    .checkbox-group { text-align: left; margin: 15px 0; font-size: 13px; font-weight: 600; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; cursor: pointer; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-jana { background-color: #008efd; color: white; }
    .btn-jana:hover { background-color: #0b5ed7; }
    .btn-reset { background-color: #dc3545; color: white; }
    .matrix-table { width: 100%; margin: 15px 0; border-collapse: collapse; font-size: 24px; font-weight: bold; background: #fff; text-align: center; }
    .matrix-table td { border: 2px solid #4a5568; padding: 12px; width: 25%; background: #fff; text-align: center; }
    .matrix-table tr:first-child td { background-color: #e2e8f0; }
    .result-box { margin-top: 15px; padding: 15px; background: #f8fafc; border-left: 4px solid #3182ce; border-radius: 6px; text-align: left; }
    .key-tag { color: #dd6b20; font-weight: 800; font-size: 17px; font-family: monospace; }
    .node-badge { display: inline-block; padding: 3px 8px; background: #0d6efd; color: white; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 5px; }
    .strategy-box { background: #edf2f7; padding: 15px; border-radius: 6px; border-left: 5px solid #0d6efd; line-height: 1.6; text-align: left; margin-top: 10px; }
    .pattern-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .pattern-box { background: white; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; text-align: center; display: flex; flex-direction: column; }
    .pattern-sumber { font-size: 10px; color: #fff; background: #4a5568; padding: 3px; border-radius: 4px; margin-bottom: 5px; font-weight: bold; }
    .pattern-name { font-size: 11px; color: #718096; font-weight: bold; text-transform: uppercase; }
    .pattern-value { font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #2d3748; }
</style>
</head>
<body>

<div class="container">
    <h2>Mesin Matriks SportsToto Pro</h2>
    <p class="subtitle">Modul Terjemahan Logik Python & Analisis Toto</p>

    <!-- Bahagian Input Utama -->
    <div class="input-group">
        <label for="num1">Nombor Cabutan Akan Datang 1:</label>
        <input type="text" id="num1" maxlength="4" placeholder="6200" value="6200">
    </div>

    <div class="input-group">
        <label for="num2">Nombor Cabutan Akan Datang 2:</label>
        <input type="text" id="num2" maxlength="4" placeholder="1755" value="1755">
    </div>

    <div class="input-group">
        <label for="history">Sejarah Cabutan Lepas (Tensor Input):</label>
        <textarea id="history" rows="3" placeholder="1508, 5241, 6336">1508\n5241\n6336</textarea>
    </div>

    <div class="checkbox-group">
        <label style="cursor:pointer; margin:0;">
            <input type="checkbox" id="useMirror" checked>
            Aktifkan Formula Cermin (+5)
        </label>
    </div>

    <div class="btn-group">
        <button class="btn-jana" onclick="jalankanAnalisisModel()">Jana Analisis Sistem</button>
        <button class="btn-reset" onclick="resetBorang()">Reset</button>
    </div>

    <!-- Bahagian Paparan Keputusan (Output) -->
    <div id="hasil" style="display: none;">
        <div class="result-box" style="border-left-color: #4a5568;">
            <p style="margin:0; font-weight:bold; font-size:13px; color: #2d3748;">📊 Visual Matriks 4x4 (Tolak 1)</p>
            <table class="matrix-table" id="matrixTable"></table>
        </div>

        <div class="result-box">
            <p style="margin:0;"><strong>Tunjang Titik Geometri:</strong> <span id="master-key" class="key-tag"></span>
            <span class="node-badge">PYTHON ENGINE</span></p>
        </div>

        <div class="strategy-box">
            <p style="margin:0; font-weight:bold; color: #1a365d; font-size:14px; border-bottom: 1px solid #cbd5e0; padding-bottom:5px; margin-bottom:8px;">🎯 Rumusan Sasaran Analisis</p>
            ✨ 1D Pelengkap: <span style="color:#2b6cb0; font-weight:bold; font-size:17px;" id="pelengkap1d"></span><br>
            🔥 2D Tunjang Asas: <span style="color:#d63031; font-weight:bold; font-size:17px;" id="tunjang2d"></span><br>
            💎 3D Muktamad Gandingan: <span style="color:#dd6b20; font-weight:bold; font-size:17px;" id="muktamad3d"></span><br>
            🎯 Target Utama 4D iBox: <strong id="target4d" style="font-size: 19px; color: #805ad5;"></strong>
        </div>

        <div class="result-box" style="background: #f0ffff; border-left-color: #198754;">
            <p style="margin:0; font-weight:bold; color: #198754;">🔲 Trajektori Laluan Pola Geometri</p>
            <div class="pattern-grid" id="gridPola"></div>
        </div>
    </div>
</div>

<script>
// Terjemahan Langsung Logik Kelas Python ke JavaScript untuk Persekitaran Pelayar Web
class MesinMatriksSportsTotoProPython {
    constructor() {
        this.mirror_map = {
            '0':'5', '1':'6', '2':'7', '3':'8', '4':'9',
            '5':'0', '6':'1', '7':'2', '8':'3', '9':'4'
        };
    }

    sortCombo(s) {
        return (s || "").split('').sort().join('');
    }

    getMirror(s) {
        return (s || "").split('').map(c => this.mirror_map[c] || c).join('');
    }

    binaMatrix4x4(str1, str2 = "8040") {
        let combined = (str1 + (str2 || "8040")).replace(/[^0-9]/g, "");
        if (combined.length < 4) combined = "7820";
        
        let base_row = combined.substring(0, 4).split('').map(Number);
        let matrix = [base_row];
        
        for (let r = 1; r < 4; r++) {
            let row = [];
            for (let c = 0; c < 4; c++) {
                let val = (matrix[r - 1][c] + 9) % 10;
                row.push(val);
            }
            matrix.push(row);
        }
        return matrix;
    }

    ekstrakTrajektoriGeometri(m) {
        return {
            "Pola L": `${m[0][0]}${m[1][0]}${m[2][0]}${m[2][1]}`,
            "L (Terbalik)": `${m[2][1]}${m[2][0]}${m[1][0]}${m[0][0]}`,
            "Pola T": `${m[0][0]}${m[0][1]}${m[0][2]}${m[1][1]}`,
            "T (Terbalik)": `${m[1][1]}${m[0][2]}${m[0][1]}${m[0][0]}`,
            "Pola Y": `${m[0][0]}${m[0][2]}${m[1][1]}${m[2][1]}`,
            "Y (Terbalik)": `${m[2][1]}${m[1][1]}${m[0][2]}${m[0][0]}`,
            "Pola Z (Zig-Zag)": `${m[0][0]}${m[1][1]}${m[1][0]}${m[3][1]}`,
            "Z (Terbalik)": `${m[0][3]}${m[1][2]}${m[2][3]}${m[3][2]}`,
            "Pepenjuru Utama": `${m[0][0]}${m[1][1]}${m[2][2]}${m[3][3]}`,
            "Pepenjuru Silang": `${m[0][3]}${m[1][2]}${m[2][1]}${m[3][0]}`
        };
    }

    janaAnalisisEksklusif(nombor_asas, nombor_kedua = "", sejarah_cabutan = [], guna_cermin = true) {
        let matrix = this.binaMatrix4x4(nombor_asas, nombor_kedua);
        let pola_map = this.ekstrakTrajektoriGeometri(matrix);

        let v1 = matrix[0][0].toString();
        let v2 = matrix[1][1].toString();
        let v3 = matrix[2][2].toString();
        let v4 = matrix[3][3].toString();

        let base_2d = this.sortCombo(v1 + v3);
        let matrix_solid_3d = this.sortCombo(v1 + v3 + v4);

        let matrix_digits = new Set();
        matrix.forEach(row => row.forEach(d => matrix_digits.add(d.toString())));

        let final_3d = matrix_solid_3d;
        if (sejarah_cabutan && sejarah_cabutan.length > 0) {
            for (let res of sejarah_cabutan) {
                let s = res.toString();
                if (s.length >= 3) {
                    let candidate_3d = this.sortCombo(s.substring(0, 3));
                    let match_count = candidate_3d.split('').filter(d => matrix_digits.has(d)).length;
                    if (match_count >= 2) {
                        final_3d = candidate_3d;
                        break;
                    }
                }
            }
        }

        let base_1d = v2;
        let target_4d = this.sortCombo(final_3d + base_1d);

        if (guna_cermin) {
            base_1d = this.getMirror(base_1d);
            base_2d = this.getMirror(base_2d);
            final_3d = this.getMirror(final_3d);
            target_4d = this.getMirror(target_4d);
            for (let key in pola_map) {
                pola_map[key] = this.getMirror(pola_map[key]);
            }
        }

        return {
            matrix: matrix,
            tunjang_geometri: [v1, v2, v3, v4],
            pelengkap_1d: base_1d,
            tunjang_2d: base_2d,
            muktamad_3d: final_3d,
            target_4d: target_4d,
            trajektori_pola: pola_map
        };
    }
}

const enjinPythonWeb = new MesinMatriksSportsTotoProPython();

function jalankanAnalisisModel() {
    const num1 = document.getElementById('num1').value.trim();
    const num2 = document.getElementById('num2').value.trim();
    const historyRaw = document.getElementById('history').value.trim();
    const gunaCermin = document.getElementById('useMirror').checked;

    if (num1.length < 3) {
        alert("Sila masukkan nombor asas minimum 3 digit.");
        return;
    }

    let sejarahList = historyRaw.match(/\b\d{4}\b/g) || [];

    let hasil = enjinPythonWeb.janaAnalisisEksklusif(num1, num2, sejarahList, gunaCermin);

    // Paparkan Jadual Matriks 4x4
    let hTable = "";
    hasil.matrix.forEach(row => {
        hTable += "<tr>";
        row.forEach(val => { hTable += `<td>${val}</td>`; });
        hTable += "</tr>";
    });
    document.getElementById('matrixTable').innerHTML = hTable;

    // Paparkan Output Teks & Sasaran
    document.getElementById('master-key').innerText = hasil.tunjang_geometri.join(' - ');
    document.getElementById('pelengkap1d').innerText = hasil.pelengkap_1d;
    document.getElementById('tunjang2d').innerText = hasil.tunjang_2d;
    document.getElementById('muktamad3d').innerText = hasil.muktamad_3d;
    document.getElementById('target4d').innerText = hasil.target_4d;

    // Paparkan Pola Geometri
    let hPola = "";
    for (let [nama, nilai] of Object.entries(hasil.trajektori_pola)) {
        hPola += `
        <div class="pattern-box">
            <span class="pattern-sumber">${nama}</span>
            <span class="pattern-name">Laluan Terarah</span>
            <span class="pattern-value">${nilai}</span>
        </div>`;
    }
    document.getElementById('gridPola').innerHTML = hPola;

    document.getElementById('hasil').style.display = 'block';
}

function resetBorang() {
    document.getElementById('num1').value = "";
    document.getElementById('num2').value = "";
    document.getElementById('history').value = "";
    document.getElementById('hasil').style.display = 'none';
}
</script>
</body>
</html>
