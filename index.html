<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix Digit Hub</title>
    <style>
      :root {
        --bg: #07131f;
        --bg-2: #0d1d2e;
        --panel: #102238;
        --panel-2: #172c45;
        --line: #35557d;
        --text: #edf4ff;
        --muted: #9fb2d0;
        --green: #69f0c7;
        --green-2: #2ce6b2;
        --blue: #7ec6ff;
        --shadow: rgba(0, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg), var(--bg-2));
        color: var(--text);
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 18px;
      }

      .phone {
        width: min(430px, 100%);
        min-height: 100vh;
        background: rgba(9, 19, 31, 0.95);
        border: 1px solid var(--line);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 18px 40px var(--shadow);
      }

      .topbar {
        background: rgba(17, 30, 44, 0.9);
        border-bottom: 1px solid var(--line);
        padding: 12px 14px 10px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        flex: 1;
      }

      .field label {
        font-size: 0.56rem;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .field input {
        width: 100%;
        background: #0a1627;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        outline: none;
        font-size: 0.88rem;
      }

      .field input:focus {
        border-color: var(--green);
      }

      .content {
        padding: 14px;
      }

      .panel {
        background: rgba(17, 34, 52, 0.82);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        margin-bottom: 16px;
      }

      .panel-title {
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 12px 18px 8px;
      }

      .grid-4 {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 10px;
        padding: 12px 14px 16px;
      }

      .grid-3 {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 10px;
        padding: 12px 14px 16px;
      }

      .cell {
        min-height: 92px;
        background: linear-gradient(180deg, #11263f, #0d1d2e);
        border: 1px solid var(--line);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px;
      }

      .cell-tag {
        font-size: 0.58rem;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .cell-value {
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        font-weight: 800;
        color: var(--green);
      }

      .engine-box {
        background: rgba(18, 35, 58, 0.9);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 16px 16px;
      }

      .engine-box .line {
        font-size: 1.05rem;
        margin: 6px 0;
        color: var(--text);
      }

      .engine-box .line strong {
        color: var(--green);
      }

      .final-box {
        margin-top: 12px;
        background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(59, 130, 246, 0.12));
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
        text-align: center;
        font-weight: 900;
        font-size: clamp(1.2rem, 4vw, 2.2rem);
        color: var(--green);
      }

      @media (max-width: 420px) {
        .grid-4, .grid-3 { grid-template-columns: repeat(2, minmax(100px, 1fr)); }
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="topbar">
        <div class="row">
          <div class="field">
            <label for="startDate">Tarikh</label>
            <input id="startDate" type="date" />
          </div>

          <div class="field">
            <label for="matrixSeed4x4">4x4</label>
            <input id="matrixSeed4x4" type="text" maxlength="4" placeholder="6205" />
          </div>

          <div class="field">
            <label for="matrixSeed3x3">3x3</label>
            <input id="matrixSeed3x3" type="text" maxlength="3" placeholder="165" />
          </div>
        </div>
      </div>

      <div class="content">
        <div class="panel">
          <div class="panel-title">MATRIX 4X4</div>
          <div id="matrix4x4" class="grid-4"></div>
        </div>

        <div class="panel">
          <div class="panel-title">MATRIX 3X3</div>
          <div id="matrix3x3" class="grid-3"></div>
        </div>

        <div class="panel">
          <div class="panel-title">SHADOW 3X3</div>
          <div id="shadow3x3" class="grid-3"></div>
        </div>

        <div class="engine-box">
          <div class="line"><strong>Seed 4x4:</strong> <span id="seed4Text">--</span></div>
          <div class="line"><strong>Seed 3x3:</strong> <span id="seed3Text">--</span></div>
          <div class="final-box">Final Candidate: <span id="finalCandidate">--</span></div>
        </div>
      </div>
    </div>

    <script>
      function sanitizeDigits(value, length) {
        const digits = String(value ?? '').replace(/\D/g, '');
        if (!digits) return '';
        return digits.slice(0, length);
      }

      function digitsOf(value, length = 4) {
        const cleaned = sanitizeDigits(value, length);
        return cleaned.padStart(length, '0').slice(0, length).split('').map(Number);
      }

      function getAutoSeedFromDate(dateValue, mode) {
        const raw = dateValue || new Date().toISOString().split('T')[0];
        const [year, month, day] = raw.split('-');
        const yy = Number(String(year || '2026').slice(-2));
        const mm = Number(month || '1');
        const dd = Number(day || '1');

        const a = (yy + mm + dd) % 10;
        const b = (mm + dd) % 10;
        const c = (yy + dd) % 10;

        if (mode === '4x4') {
          return `${dd}${a}${b}${c}`.slice(0, 4).padStart(4, '0');
        }

        if (mode === '3x3') {
          return `${a}${b}${c}`.slice(0, 3).padStart(3, '0');
        }

        return '';
      }

      function resolveSeed(inputId, mode, dateValue) {
        const input = document.getElementById(inputId);
        const manual = sanitizeDigits(input?.value || '', mode === '4x4' ? 4 : 3);
        if (manual) return manual.padStart(mode === '4x4' ? 4 : 3, '0');
        return getAutoSeedFromDate(dateValue, mode);
      }

      function normalizeSeed(seed, length) {
        return sanitizeDigits(seed, length).padStart(length, '0').slice(0, length);
      }

      function buildMatrix4x4(seed) {
        const digits = digitsOf(seed, 4);
        const matrix = [digits.slice()];
        for (let r = 1; r < 4; r++) {
          const row = [];
          for (let c = 0; c < 4; c++) {
            row.push((matrix[r - 1][c] + 1) % 10);
          }
          matrix.push(row);
        }
        return matrix;
      }

      function buildMatrix3x3(seed) {
        const digits = digitsOf(seed, 3);
        const matrix = [digits.slice()];
        for (let r = 1; r < 3; r++) {
          const row = [];
          for (let c = 0; c < 3; c++) {
            row.push((matrix[r - 1][c] + 2) % 10);
          }
          matrix.push(row);
        }
        return matrix;
      }

      function buildShadow3x3(seed) {
        const digits = digitsOf(seed, 3);
        const matrix = [digits.slice()];
        for (let r = 1; r < 3; r++) {
          const row = [];
          for (let c = 0; c < 3; c++) {
            row.push((matrix[r - 1][c] + 5) % 10);
          }
          matrix.push(row);
        }
        return matrix;
      }

      function renderGrid(targetId, matrix) {
        const target = document.getElementById(targetId);
        if (!target) return;
        target.innerHTML = '';

        matrix.forEach((row, rowIndex) => {
          row.forEach((value, colIndex) => {
            const cell = document.createElement('div');
            cell.className = 'cell';

            const tag = document.createElement('div');
            tag.className = 'cell-tag';
            tag.textContent = `${rowIndex + 1}:${colIndex + 1}`;

            const num = document.createElement('div');
            num.className = 'cell-value';
            num.textContent = String(value);

            cell.appendChild(tag);
            cell.appendChild(num);
            target.appendChild(cell);
          });
        });
      }

      function render() {
        const dateValue = document.getElementById('startDate')?.value || new Date().toISOString().split('T')[0];
        const seed4 = normalizeSeed(resolveSeed('matrixSeed4x4', '4x4', dateValue), 4);
        const seed3 = normalizeSeed(resolveSeed('matrixSeed3x3', '3x3', dateValue), 3);

        const matrix4x4 = buildMatrix4x4(seed4);
        const matrix3x3 = buildMatrix3x3(seed3);
        const shadow3x3 = buildShadow3x3(seed3);

        renderGrid('matrix4x4', matrix4x4);
        renderGrid('matrix3x3', matrix3x3);
        renderGrid('shadow3x3', shadow3x3);

        document.getElementById('seed4Text').textContent = seed4;
        document.getElementById('seed3Text').textContent = seed3;
        document.getElementById('finalCandidate').textContent = `${seed4} / ${seed3}`;
      }

      document.addEventListener('DOMContentLoaded', () => {
        const startDate = document.getElementById('startDate');
        const seed4 = document.getElementById('matrixSeed4x4');
        const seed3 = document.getElementById('matrixSeed3x3');

        const today = new Date().toISOString().split('T')[0];
        if (startDate && !startDate.value) startDate.value = today;

        startDate.addEventListener('change', render);
        seed4.addEventListener('input', render);
        seed3.addEventListener('input', render);

        render();
      });
    </script>
  </body>
</html>
