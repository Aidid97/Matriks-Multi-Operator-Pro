<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Nombor 2D/3D</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box; /* Memastikan kotak tidak terkeluar dari sempadan */
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            font-size: 32px;
            font-weight: bold;
            color: #d9534f;
            margin-top: 15px;
            min-height: 40px; /* Supaya kotak tak melompat masa nombor ditukar */
        }
        .kaunter-teks {
            margin-top: 15px; 
            font-size: 14px; 
            font-weight: bold; 
            color: #555;
            padding: 5px;
            background-color: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Penjana Nombor 2D/3D</h2>
        
        <label for="inputNumbers">Masukkan 2 atau 3 nombor:</label>
        <input type="number" id="inputNumbers" placeholder="Contoh: 45 atau 123" min="0" max="999">

        <label for="inputDate">Pilih Tarikh (Pilihan):</label>
        <input type="date" id="inputDate">

        <label for="digitType">Pilih Jenis Janaan:</label>
        <select id="digitType">
            <option value="2">2D (Dua Digit)</option>
            <option value="3">3D (Tiga Digit)</option>
        </select>
        
        <button onclick="generateRandom()">Jana Nombor!</button>
        
        <!-- Bahagian Kaunter -->
        <p class="kaunter-teks">
            Jumlah Janaan Anda: <span id="kaunterPaparan" style="color: #007bff;">0</span> kali
        </p>

        <p>Nombor Bertuah Anda:</p>
        <div class="result" id="resultDisplay">-</div>
    </div>

    <script>
        // Memuatkan nilai kaunter dari localStorage (memori telefon) apabila web dibuka
        let jumlahKiraan = localStorage.getItem("jumlahJanaanTerkumpul") || 0;
        document.getElementById("kaunterPaparan").innerText = jumlahKiraan;

        function getMirror(digit) {
            const mirrors = {
                '0': '5', '1': '6', '2': '7', '3': '8', '4': '9',
                '5': '0', '6': '1', '7': '2', '8': '3', '9': '4'
            };
            return mirrors[digit] || digit;
        }

        function generateRandom() {
            let userInputs = document.getElementById('inputNumbers').value;
            let dateInput = document.getElementById('inputDate').value;
            let digitType = document.getElementById('digitType').value;
            let display = document.getElementById('resultDisplay');

            // Kumpulkan semua nombor yang berpotensi
            let pool = "";

            if (userInputs) {
                pool += userInputs; // Nombor asal
                // Masukkan nombor cermin
                for (let i = 0; i < userInputs.length; i++) {
                    pool += getMirror(userInputs[i]); 
                }
            }

            if (dateInput) {
                // Buang tanda sengkang (-) dan ambil angka sahaja (contoh: 20261012)
                let cleanDate = dateInput.replace(/-/g, "");
                pool += cleanDate;
            }

            // Jika pengguna tidak masukkan apa-apa nombor atau tarikh
            if (!pool) {
                pool = "0123456789"; // Gunakan nombor rawak sepenuhnya
            }

            let length = parseInt(digitType);
            
            // Animasi kocokan nombor (Shuffle Effect)
            let duration = 1000; 
            let intervalTime = 50; 
            let passedTime = 0;

            let interval = setInterval(() => {
                let tempNum = "";
                for(let i = 0; i < length; i++) {
                    tempNum += Math.floor(Math.random() * 10);
                }
                display.innerText = tempNum;
                passedTime += intervalTime;

                if (passedTime >= duration) {
                    clearInterval(interval);
                    
                    // Janaan nombor akhir dari 'pool'
                    let finalNum = "";
                    let poolArray = pool.split('');
                    
                    for(let i = 0; i < length; i++) {
                        // Pilih aksara rawak dari kumpulan nombor (pool)
                        let randomIndex = Math.floor(Math.random() * poolArray.length);
                        finalNum += poolArray[randomIndex];
                    }
                    display.innerText = finalNum;

                    // Mengemaskini Kaunter selepas janaan selesai
                    jumlahKiraan++;
                    document.getElementById("kaunterPaparan").innerText = jumlahKiraan;
                    // Simpan nilai baru ke dalam memori peranti
                    localStorage.setItem("jumlahJanaanTerkumpul", jumlahKiraan);
                }
            }, intervalTime);
        }
    </script>

    <!-- Kod Iklan Adsterra (Social Bar) -->
    <script data-cfasync="false" src="https://bauval.org/14/8ed7ff2149891600bc1774052ca193b4"></script>

</body>
</html>
