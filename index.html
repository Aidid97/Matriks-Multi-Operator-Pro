<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix Engine</title>
    <style>
      :root {
        --bg: #07131f;
        --bg2: #0d1d2e;
        --panel: #102338;
        --panel2: #172d46;
        --line: #2f577d;
        --text: #ebf5ff;
        --muted: #a5bfdc;
        --green: #81f2d2;
        --green2: #4cebb0;
        --shadow: rgba(0,0,0,0.3);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg), var(--bg2));
        color: var(--text);
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 18px;
      }

      .phone {
        width: min(430px, 100%);
        min-height: 100vh;
        background: rgba(9, 19, 31, 0.96);
        border: 1px solid var(--line);
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 18px 40px var(--shadow);
      }

      .topbar {
        background: rgba(17, 30, 44, 0.96);
        border-bottom: 1px solid var(--line);
        padding: 12px 14px 10px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: end;
      }

      .field {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 0.56rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .field input {
        width: 100%;
        background: #0a1627;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 10px;
        padding: 9px 10px;
        font-size: 0.9rem;
        outline: none;
      }

      .field input:focus {
        border-color: var(--green2);
      }

      .content {
        padding: 14px;
      }

      .panel {
        background: rgba(17, 34, 52, 0.82);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        margin-bottom: 16px;
      }

      .panel-title {
        padding: 12px 16px 8px;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .matrix-4x4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 12px 14px 16px;
      }

      .matrix-3x3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 12px 14px 16px;
      }

      .cell {
        min-height: 92px;
        background: linear-gradient(180deg, #11263f, #0d1d2e);
        border: 1px solid var(--line);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px;
      }

      .cell-tag {
        font-size: 0.58rem;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .cell-value {
        font-size: clamp(1.5rem, 4vw, 2.4rem);
        font-weight: 800;
        color: var(--green);
      }

      .prediction-box {
        margin-top: 8px;
        background: linear-gradient(135deg, rgba(52, 211, 153, 0.18), rgba(59,130,246,0.10));
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 16px;
        text-align: center;
        font-weight: 900;
        font-size: clamp(1.1rem, 3.5vw, 1.8rem);
        color: var(--green);
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="topbar">
        <div class="row">
          <div class="field">
            <label for="startDate">Tarikh</label>
            <input id="startDate" type="date" />
          </div>

          <div class="field">
            <label for="matrixSeed4x4">4x4</label>
            <input id="matrixSeed4x4" type="text" maxlength="4" placeholder="6298" />
          </div>

          <div class="field">
            <label for="matrixSeed3x3">3x3</label>
            <input id="matrixSeed3x3" type="text" maxlength="4" placeholder="6298" />
          </div>
        </div>
      </div>

      <div class="content">
        <div class="panel">
          <div class="panel-title">Matrix 4x4</div>
          <div id="matrix4x4" class="matrix-4x4"></div>
        </div>

        <div class="panel">
          <div class="panel-title">Matrix 3x3</div>
          <div id="matrix3x3" class="matrix-3x3"></div>
        </div>

        <div class="panel">
          <div class="panel-title">Shadow 3x3</div>
          <div id="shadow3x3" class="matrix-3x3"></div>
        </div>

        <div class="prediction-box">
          3D Probable: <span id="predictionOutput">151 • 373 • 595</span>
        </div>
      </div>
    </div>

    <script>
      const mirrorMap = {
        0: 5,
        1: 6,
        2: 7,
        3: 8,
        4: 9,
        5: 0,
        6: 1,
        7: 2,
        8: 3,
        9: 4
      };

      function sanitizeDigits(value, length) {
        const digits = String(value ?? '').replace(/\D/g, '');
        if (!digits) return '';
        return digits.slice(0, length);
      }

      function digitsOf(value, length) {
        const cleaned = sanitizeDigits(value, length);
        if (!cleaned) return Array(length).fill(0);
        return cleaned.padStart(length, '0').slice(0, length).split('').map(Number);
      }

      function getAutoSeed4(dateValue) {
        const raw = dateValue || new Date().toISOString().split('T')[0];
        const [year, month, day] = raw.split('-');
        const yy = Number(String(year || '2026').slice(-2));
        const mm = Number(month || '1');
        const dd = Number(day || '1');
        const a = (yy + mm + dd) % 10;
        const b = (mm + dd) % 10;
        const c = (yy + dd) % 10;
        return `${dd}${a}${b}${c}`.slice(0, 4).padStart(4, '0');
      }

      function resolveSeed4(dateValue) {
        const manual = sanitizeDigits(document.getElementById('matrixSeed4x4').value, 4);
        if (manual) return manual.padStart(4, '0');
        return getAutoSeed4(dateValue);
      }

      function resolveSeed3(dateValue) {
        const manual = sanitizeDigits(document.getElementById('matrixSeed3x3').value, 4);
        if (manual) return manual.slice(-3).padStart(3, '0');

        const fallback = getAutoSeed4(dateValue);
        return fallback.slice(-3).padStart(3, '0');
      }

      function buildMatrix4x4(seed4) {
        const digits = digitsOf(seed4, 4);
        const matrix = [digits.slice()];

        for (let r = 1; r < 4; r++) {
          const row = [];
          for (let c = 0; c < 4; c++) {
            row.push((matrix[r - 1][c] - 1 + 10) % 10);
          }
          matrix.push(row);
        }

        return matrix;
      }

      function buildMatrix3x3(seed3) {
        const digits = digitsOf(seed3, 3);
        const matrix = [digits.slice()];

        for (let r = 1; r < 3; r++) {
          const row = [];
          for (let c = 0; c < 3; c++) {
            row.push((matrix[r - 1][c] + 2) % 10);
          }
          matrix.push(row);
        }

        return matrix;
      }

      function buildShadow3x3(seed3) {
        const main = buildMatrix3x3(seed3);
        const shadow = [];

        shadow.push(main[0].map(v => mirrorMap[v]));

        for (let r = 1; r < 3; r++) {
          const row = [];
          for (let c = 0; c < 3; c++) {
            const prev = shadow[r - 1][c];
            row.push((mirrorMap[prev] + 5) % 10);
          }
          shadow.push(row);
        }

        return shadow;
      }

      function renderMatrix(targetId, matrix) {
        const target = document.getElementById(targetId);
        if (!target) return;

        target.innerHTML = '';

        matrix.forEach((row, rowIndex) => {
          row.forEach((value, colIndex) => {
            const cell = document.createElement('div');
            cell.className = 'cell';

            const tag = document.createElement('div');
            tag.className = 'cell-tag';
            tag.textContent = `${rowIndex + 1}:${colIndex + 1}`;

            const num = document.createElement('div');
            num.className = 'cell-value';
            num.textContent = String(value);

            cell.appendChild(tag);
            cell.appendChild(num);
            target.appendChild(cell);
          });
        });
      }

      function get3dProbables(seed3) {
        const main = buildMatrix3x3(seed3);
        const shadow = buildShadow3x3(seed3);
        const list = [];

        main.forEach(row => list.push(row.join('')));
        shadow.forEach(row => list.push(row.join('')));

        return Array.from(new Set(list)).slice(0, 6);
      }

      function render() {
        const dateValue = document.getElementById('startDate').value || new Date().toISOString().split('T')[0];

        const seed4 = resolveSeed4(dateValue);
        const seed3 = resolveSeed3(dateValue);

        const matrix4x4 = buildMatrix4x4(seed4);
        const matrix3x3 = buildMatrix3x3(seed3);
        const shadow3x3 = buildShadow3x3(seed3);

        renderMatrix('matrix4x4', matrix4x4);
        renderMatrix('matrix3x3', matrix3x3);
        renderMatrix('shadow3x3', shadow3x3);

        const probables = get3dProbables(seed3);
        document.getElementById('predictionOutput').textContent = probables.join(' • ');
      }

      document.addEventListener('DOMContentLoaded', () => {
        const dateField = document.getElementById('startDate');
        dateField.value = new Date().toISOString().split('T')[0];

        dateField.addEventListener('change', render);
        document.getElementById('matrixSeed4x4').addEventListener('input', render);
        document.getElementById('matrixSeed3x3').addEventListener('input', render);

        render();
      });
    </script>
  </body>
</html>
