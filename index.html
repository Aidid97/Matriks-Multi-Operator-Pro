<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesin Matriks Multi-Operator Pro (Toto & GD Lotto)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 520px;
            width: 100%;
        }
        h2 { text-align: center; color: #1a365d; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #718096; font-size: 13px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input[type="text"], textarea, select {
            width: 100%; padding: 12px; border: 2px solid #cbd5e0;
            border-radius: 8px; box-sizing: border-box; font-size: 16px;
            font-family: monospace;
        }
        select { font-family: 'Segoe UI', sans-serif; font-weight: bold; cursor: pointer; }
        textarea { font-size: 14px; resize: vertical; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #3182ce; }
        .checkbox-group { margin: 15px 0; font-size: 14px; font-weight: 600; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-jana { background-color: #3182ce; color: white; }
        .btn-jana:hover { background-color: #2b6cb0; }
        .btn-reset { background-color: #e53e3e; color: white; }
        .btn-copy { background-color: #38a169; color: white; font-size: 12px; padding: 4px 8px; border-radius: 4px; float: right; }
        .result-box {
            margin-top: 20px; padding: 15px; background: #f7fafc;
            border-left: 4px solid #3182ce; border-radius: 6px;
        }
        .number-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 8px; margin-top: 10px;
        }
        .number-tag {
            background: #2d3748; color: #fff; padding: 8px 0;
            text-align: center; border-radius: 6px; font-weight: bold;
            font-family: monospace; font-size: 16px; letter-spacing: 1px;
        }
        .key-tag { color: #dd6b20; font-weight: 800; font-size: 18px; letter-spacing: 2px; }
        .anchor-tag { background: #2b6cb0; }
        .badge-mode {
            display: inline-block; padding: 3px 8px; border-radius: 4px;
            font-size: 11px; font-weight: bold; color: white; background: #805ad5; margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mesin Matriks Multi-Operator Pro</h2>
    <p class="subtitle">Sistem Penjanaan Presisi Tinggi (SportsToto & Grand Dragon 4D)</p>
    
    <!-- Pilihan Operator / Pasaran -->
    <div class="input-group">
        <label for="operator">Pilih Operator / Pasaran:</label>
        <select id="operator">
            <option value="toto">SportsToto (3x Seminggu - Mod Stabil)</option>
            <option value="gdlotto">GD Lotto (Setiap Hari - Mod Drift Pantas)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="num1">Nomor Dasar 1 (Contoh: 3594):</label>
        <input type="text" id="num1" maxlength="4" placeholder="0000" pattern="\d*" required>
    </div>
    
    <div class="input-group">
        <label for="num2">Nomor Dasar 2 (Contoh: 8040):</label>
        <input type="text" id="num2" maxlength="4" placeholder="0000" pattern="\d*" required>
    </div>

    <div class="input-group">
        <label for="history">Sejarah Cabutan Lepas (Paste Result):</label>
        <textarea id="history" rows="3" placeholder="Paste result lepas di sini...&#10;Contoh: 1508, 5241, 6336, 2203, 4065..."></textarea>
    </div>

    <div class="checkbox-group">
        <label><input type="checkbox" id="useMirror" checked> Aktifkan Formula Cermin (0↔5, 1↔6, 2↔7, 3↔8, 4↔9)</label>
    </div>
    
    <div class="btn-group">
        <button class="btn-jana" onclick="janaKeputusan()">Proses Anchor & Pivot</button>
        <button class="btn-reset" onclick="resetBorang()">Reset</button>
    </div>

    <div id="hasil" style="display: none;">
        <div class="result-box">
            <p><strong>Kunci Matriks Dominan:</strong> <span id="master-key" class="key-tag"></span> <span id="mode-badge" class="badge-mode"></span></p>
            <p id="pivot-info" style="margin-top:5px; font-size:13px; color:#2c5282;">
                <strong>Digit Pivot Utama (Mean Reversion):</strong> <span id="pivot-keys" style="font-weight:bold;"></span>
            </p>
        </div>
        
        <div class="result-box">
            <p><strong>2D Anchor Solid (Tunjang)</strong> <button class="btn-copy" onclick="salin('out-2d')">Salin 2D</button></p>
            <div id="out-2d" class="number-grid"></div>
        </div>

        <div class="result-box" style="border-left-color: #d69e2e;">
            <p><strong>Proyeksi 3D Muktamad (Solid Core)</strong> <button class="btn-copy" style="background:#d69e2e;" onclick="salin('out-3d')">Salin 3D</button></p>
            <div id="out-3d" class="number-grid"></div>
        </div>

        <div class="result-box" style="border-left-color: #805ad5;">
            <p><strong>Proyeksi 4D iBox (3D Muktamad + Golden 1D)</strong> <button class="btn-copy" style="background:#805ad5;" onclick="salin('out-4d')">Salin 4D</button></p>
            <div id="out-4d" class="number-grid"></div>
        </div>
    </div>
</div>

<script>
    class MesinMatriksPro {
        constructor() {
            this.MIRROR_MAP = {
                '0':'5', '1':'6', '2':'7', '3':'8', '4':'9',
                '5':'0', '6':'1', '7':'2', '8':'3', '9':'4'
            };
        }

        sortCombo(str) { return str.split('').sort().join(''); }

        uraiAkar(nomborAsas) {
            let digits = nomborAsas.split('').map(Number);
            let sum = digits.reduce((a, b) => a + b, 0); 
            let sumStr = sum.toString();
            let sumDigits = sumStr.split('').map(Number);
            
            let cabangTambah = sumDigits.reduce((a, b) => a + b, 0);
            let cabangTolak = sumDigits.length > 1 ? Math.abs(sumDigits[0] - sumDigits[1]) : sumDigits[0];
            
            let rawData = nomborAsas + sumStr + cabangTambah.toString() + cabangTolak.toString();
            return { akar: sum, rawData: rawData };
        }

        kiraTrajektori(sejarahCabutan, isGDLotto) {
            let skor = [];
            let t3 = sejarahCabutan.slice(0, 3).join('');
            let t5 = sejarahCabutan.slice(0, 5).join('');
            let t15 = sejarahCabutan.slice(0, 15).join('');

            // Pemberat Trajektori mengikut pasaran
            let w_micro = isGDLotto ? 0.7 : 0.5; // GD Lotto utamakan pergerakan 3 cabutan terdekat
            let w_velocity = isGDLotto ? 0.3 : 0.5;

            for (let i = 0; i <= 9; i++) {
                let d = i.toString();
                let f_mikro = t3.split(d).length - 1;
                let c_t5 = t5.split(d).length - 1;
                let c_t15 = t15.split(d).length - 1;
                
                let halaju = (c_t5 / 5.0) - (c_t15 / 15.0);
                skor.push({ digit: d, skor: (w_micro * f_mikro) + (w_velocity * halaju) });
            }
            return skor.sort((a, b) => b.skor - a.skor).map(x => x.digit);
        }

        cariPelengkapEmas(kombinasi3D, rawAkarData) {
            let pelengkap = [];
            let set3D = kombinasi3D.split('');

            set3D.forEach(digit => {
                let cermin = this.MIRROR_MAP[digit];
                if (!set3D.includes(cermin) && rawAkarData.includes(cermin)) {
                    pelengkap.push(cermin);
                }
            });
            return [...new Set(pelengkap)];
        }

        jana(nomborAsas, sejarahCabutan, gunaCermin, operator) {
            let isGDLotto = (operator === 'gdlotto');
            let dataAkar = this.uraiAkar(nomborAsas);
            let trajektori = this.kiraTrajektori(sejarahCabutan, isGDLotto);
            
            let hotDigits = trajektori.slice(0, 4); 
            let coldPivot = isGDLotto ? trajektori.slice(-4) : trajektori.slice(-3); 

            // 1. Pembentukan 2D Anchor
            let anchors2D = new Set();
            for (let i = 0; i < hotDigits.length; i++) {
                for (let j = i + 1; j < hotDigits.length; j++) {
                    anchors2D.add(this.sortCombo(hotDigits[i] + hotDigits[j]));
                }
            }
            if (gunaCermin) {
                hotDigits.forEach(d => {
                    anchors2D.add(this.sortCombo(d + this.MIRROR_MAP[d]));
                });
            }
            let array2D = Array.from(anchors2D);

            // 2. Pembentukan 3D Teras (Mengelakkan Perangkap Kembar)
            let core3DSet = new Set();
            array2D.forEach(anchor => {
                coldPivot.forEach(pivot => {
                    core3DSet.add(this.sortCombo(anchor + pivot));
                });
                nomborAsas.split('').forEach(pivot => {
                    core3DSet.add(this.sortCombo(anchor + pivot));
                });
            });

            // Bagi GD Lotto, tambah variasi silang trajektori top 3 untuk cegah 3D mengecil
            if (isGDLotto) {
                core3DSet.add(this.sortCombo(hotDigits[0] + hotDigits[1] + hotDigits[2]));
                core3DSet.add(this.sortCombo(hotDigits[0] + hotDigits[1] + hotDigits[3]));
            }

            let array3DMuktamad = Array.from(core3DSet).slice(0, 12);

            // 3. Pembentukan 4D iBox
            let set4D = new Set();
            array3DMuktamad.forEach(kombo3D => {
                let senaraiPelengkap = this.cariPelengkapEmas(kombo3D, dataAkar.rawData);
                
                nomborAsas.split('').forEach(d => {
                    if (!kombo3D.includes(d)) {
                        senaraiPelengkap.push(d);
                    }
                });

                if (gunaCermin) {
                    kombo3D.split('').forEach(d => {
                        senaraiPelengkap.push(this.MIRROR_MAP[d]);
                    });
                }

                [...new Set(senaraiPelengkap)].forEach(p => {
                    set4D.add(this.sortCombo(kombo3D + p));
                });
            });

            return {
                tunjang: hotDigits,
                pivot: coldPivot,
                keputusan2D: array2D,
                keputusan3D: array3DMuktamad,
                keputusan4D: Array.from(set4D).slice(0, 16)
            };
        }
    }

    const enjin = new MesinMatriksPro();

    function janaKeputusan() {
        const str1 = document.getElementById('num1').value.trim();
        const str2 = document.getElementById('num2').value.trim();
        const historyRaw = document.getElementById('history').value.trim();
        const gunaCermin = document.getElementById('useMirror').checked;
        const operator = document.getElementById('operator').value;

        if (str1.length < 3 && str2.length < 3) {
            alert("Silakan masukkan nombor dasar yang valid (minimal 3D).");
            return;
        }

        const nomborAsas = str1 + str2; 

        let sejarahCabutan = historyRaw.match(/\b\d{4}\b/g);
        
        if (!sejarahCabutan || sejarahCabutan.length < 3) {
            sejarahCabutan = ["1508", "5241", "6336", "2203", "4065", "2464", "0431", "2182", "2275", "9055"];
        }

        const hasil = enjin.jana(nomborAsas, sejarahCabutan, gunaCermin, operator);

        document.getElementById('master-key').innerText = hasil.tunjang.join(' - ');
        document.getElementById('pivot-keys').innerText = hasil.pivot.join(', ');
        document.getElementById('mode-badge').innerText = operator.toUpperCase();

        document.getElementById('out-2d').innerHTML = hasil.keputusan2D.map(n => `<div class="number-tag anchor-tag">${n}</div>`).join('');
        document.getElementById('out-2d').setAttribute('data-raw', hasil.keputusan2D.join(', '));

        document.getElementById('out-3d').innerHTML = hasil.keputusan3D.map(n => `<div class="number-tag" style="background:#d69e2e;">${n}</div>`).join('');
        document.getElementById('out-3d').setAttribute('data-raw', hasil.keputusan3D.join(', '));

        document.getElementById('out-4d').innerHTML = hasil.keputusan4D.map(n => `<div class="number-tag" style="background:#805ad5;">${n}</div>`).join('');
        document.getElementById('out-4d').setAttribute('data-raw', hasil.keputusan4D.join(', '));

        document.getElementById('hasil').style.display = 'block';
    }

    function resetBorang() {
        document.getElementById('num1').value = '';
        document.getElementById('num2').value = '';
        document.getElementById('history').value = '';
        document.getElementById('hasil').style.display = 'none';
    }

    function salin(id) {
        const txt = document.getElementById(id).getAttribute('data-raw');
        if(txt) {
            navigator.clipboard.writeText(txt).then(() => alert("Berhasil disalin: " + txt));
        }
    }
</script>
