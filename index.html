<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix Protocol Engine</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #101827;
        --panel-2: #111f33;
        --card: #17233a;
        --line: #2e3d59;
        --text: #e5edf9;
        --muted: #9aa8c3;
        --blue: #60a5fa;
        --green: #34d399;
        --gold: #fbbf24;
        --red: #f87171;
        --purple: #a78bfa;
        --shadow: rgba(0, 0, 0, 0.3);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg), #111827);
        color: var(--text);
        font-family: Arial, sans-serif;
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .app {
        width: min(1100px, 100%);
        background: rgba(16, 24, 39, 0.9);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 20px 50px var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .title {
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .date-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 10px;
      }

      .date-box {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 170px;
      }

      .date-box label {
        font-size: 0.7rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .date-box input {
        background: #0a1426;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        outline: none;
      }

      .seed-box {
        background: #0a1426;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        width: 170px;
        outline: none;
      }

      .button {
        border: none;
        background: linear-gradient(135deg, var(--blue), var(--purple));
        color: white;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .button:hover { transform: translateY(-1px); opacity: 0.97; }
      .button:active { transform: translateY(0); }

      .content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }

      .panel-header {
        background: var(--panel-2);
        border-bottom: 1px solid var(--line);
        padding: 12px 14px;
        font-size: 0.76rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .matrix {
        display: grid;
        gap: 8px;
        padding: 14px;
      }

      .matrix-4x4 { grid-template-columns: repeat(4, minmax(90px, 1fr)); }
      .matrix-3x3 { grid-template-columns: repeat(3, minmax(90px, 1fr)); }

      .cell {
        min-height: 78px;
        border-radius: 12px;
        background: linear-gradient(180deg, #101d32, #0a1426);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        text-align: center;
        padding: 8px;
      }

      .tag {
        font-size: 0.52rem;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .number {
        font-size: 1.28rem;
        font-weight: 700;
        color: var(--green);
      }

      .status-bar {
        margin-top: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        min-height: 150px;
      }

      .status-title {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .final-text {
        display: grid;
        gap: 6px;
        line-height: 1.6;
        font-size: 0.95rem;
        color: var(--text);
      }

      .candidate {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(52, 211, 153, 0.08);
        font-weight: 700;
        color: var(--green);
        font-size: 1rem;
      }

      @media (max-width: 760px) {
        .content { grid-template-columns: 1fr; }
        .matrix-4x4, .matrix-3x3 { grid-template-columns: repeat(2, minmax(100px, 1fr)); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="title">Protocol Matrix Engine</div>

        <div class="date-row">
          <div class="date-box">
            <label for="startDate">Tarikh Mula</label>
            <input id="startDate" type="date" />
          </div>

          <div class="date-box">
            <label for="matrixSeed4x4">Seed 4x4</label>
            <input id="matrixSeed4x4" class="seed-box" type="text" placeholder="6204" value="" />
          </div>

          <div class="date-box">
            <label for="matrixSeed3x3">Seed 3x3</label>
            <input id="matrixSeed3x3" class="seed-box" type="text" placeholder="620" value="" />
          </div>

          <button class="button" id="generateBtn">Generate</button>
        </div>
      </div>

      <div class="content">
        <div class="panel">
          <div class="panel-header">Matrix 4x4</div>
          <div class="matrix matrix-4x4" id="matrix4x4"></div>
        </div>

        <div class="panel">
          <div class="panel-header">Matrix 3x3</div>
          <div class="matrix matrix-3x3" id="matrix3x3"></div>
        </div>
      </div>

      <div class="status-bar">
        <div class="status-title">Engine Status</div>
        <div class="final-text" id="finalStatus"></div>
      </div>

      <div class="candidate">
        Final Candidate: <span id="finalCandidate">--</span>
      </div>
    </div>

    <script>
      function sanitizeDigits(value, length) {
        const digits = String(value ?? '').replace(/\D/g, '');
        if (!digits) return '';
        return digits.slice(0, length);
      }

      function digitsOf(value, length = 4) {
        const cleaned = sanitizeDigits(value, length);
        return cleaned.padStart(length, '0').slice(0, length).split('').map(Number);
      }

      function getAutoSeedFromDate(dateValue, mode) {
        const raw = dateValue || new Date().toISOString().split('T')[0];
        const [year, month, day] = raw.split('-');
        const yy = Number(String(year || '2026').slice(-2));
        const mm = Number(month || '1');
        const dd = Number(day || '1');

        const a = (yy + mm + dd) % 10;
        const b = (mm + dd) % 10;
        const c = (yy + dd) % 10;

        if (mode === '4x4') {
          return `${dd}${a}${b}${c}`.slice(0, 4).padStart(4, '0');
        }

        if (mode === '3x3') {
          return `${a}${b}${c}`.slice(0, 3).padStart(3, '0');
        }

        return '';
      }

      function resolveSeed(inputId, mode, dateValue) {
        const input = document.getElementById(inputId);
        const manual = sanitizeDigits(input?.value || '', mode === '4x4' ? 4 : 3);
        if (manual) return manual.padStart(mode === '4x4' ? 4 : 3, '0');
        return getAutoSeedFromDate(dateValue, mode);
      }

      function buildMatrix4x4(seed) {
        const digits = digitsOf(seed, 4);
        const matrix = [digits.slice()];
        for (let r = 1; r < 4; r++) {
          const row = [];
          for (let c = 0; c < 4; c++) {
            row.push((matrix[r - 1][c] + 1) % 10);
          }
          matrix.push(row);
        }
        return matrix;
      }

      function buildMatrix3x3(seed) {
        const digits = digitsOf(seed, 3);
        const matrix = [digits.slice()];
        for (let r = 1; r < 3; r++) {
          const row = [];
          for (let c = 0; c < 3; c++) {
            row.push((matrix[r - 1][c] + 2) % 10);
          }
          matrix.push(row);
        }
        return matrix;
      }

      function matrixSum(matrix) {
        return matrix.flat().reduce((sum, value) => sum + value, 0);
      }

      function getFrequency(results) {
        const map = new Map();
        for (const value of results) {
          const digits = digitsOf(value, 4);
          for (const digit of digits) {
            map.set(digit, (map.get(digit) || 0) + 1);
          }
        }
        return map;
      }

      function computeGeometry(seed4, seed3) {
        const variants = new Set();
        const digits4 = String(seed4).split('');
        const digits3 = String(seed3).split('');

        for (const arr of [digits4, digits3]) {
          variants.add(arr.slice().reverse().join(''));
          if (arr.length >= 2) {
            const swapped = [...arr];
            [swapped[0], swapped[1]] = [swapped[1], swapped[0]];
            variants.add(swapped.join(''));
          }
        }

        const values = [...variants].filter(Boolean);
        const mirror = values.length > 0 ? values[0] : '000';

        return {
          label: values.length > 0 ? `Mirror / Geometry OK (${mirror})` : 'Geometry neutral',
          score: values.length * 10
        };
      }

      function computeTrajectory(dateValue, seed4, seed3) {
        const raw = dateValue || new Date().toISOString().split('T')[0];
        const [year, month, day] = raw.split('-');
        const yy = Number(String(year || '2026').slice(-2));
        const mm = Number(month || '1');
        const dd = Number(day || '1');

        const total = yy + mm + dd;
        const seedTotal = digitsOf(seed4, 4).reduce((sum, v) => sum + v, 0) + digitsOf(seed3, 3).reduce((sum, v) => sum + v, 0);
        const delta = (total - seedTotal) % 10;

        return {
          label: delta >= 5 ? 'Trajectory upward' : 'Trajectory stable',
          score: delta + 1
        };
      }

      function computeWeightedScore({ freqMap, matrix4x4, matrix3x3, geometry, trajectory }) {
        const sortedDigits = [...freqMap.entries()].sort((a, b) => b[1] - a[1]);
        const topDigit = sortedDigits[0] ? sortedDigits[0][0] : 0;
        const score =
          (sortedDigits[0]?.[1] ?? 0) * 2.2 +
          matrix4x4 * 0.8 +
          matrix3x3 * 1.0 +
          geometry.score * 0.9 +
          trajectory.score * 1.4;

        let label = 'Medium zone';
        if (score >= 90) label = 'High priority zone';
        else if (score >= 70) label = 'Strong signal';
        else if (score >= 50) label = 'Watch zone';

        return { label, score, topDigit };
      }

      function renderMatrix(targetId, matrix) {
        const target = document.getElementById(targetId);
        if (!target) return;

        target.innerHTML = '';
        matrix.forEach((row, rowIndex) => {
          row.forEach((cellValue, colIndex) => {
            const cell = document.createElement('div');
            cell.className = 'cell';

            const tag = document.createElement('div');
            tag.className = 'tag';
            tag.textContent = `${rowIndex + 1}:${colIndex + 1}`;

            const number = document.createElement('div');
            number.className = 'number';
            number.textContent = String(cellValue);

            cell.appendChild(tag);
            cell.appendChild(number);
            target.appendChild(cell);
          });
        });
      }

      function renderProtocol() {
        const dateValue = document.getElementById('startDate')?.value || new Date().toISOString().split('T')[0];
        const seed4 = resolveSeed('matrixSeed4x4', '4x4', dateValue);
        const seed3 = resolveSeed('matrixSeed3x3', '3x3', dateValue);

        const matrix4x4 = buildMatrix4x4(seed4);
        const matrix3x3 = buildMatrix3x3(seed3);
        const freqMap = getFrequency([seed4, seed3]);
        const matrix4Score = matrixSum(matrix4x4);
        const matrix3Score = matrixSum(matrix3x3);
        const geometry = computeGeometry(seed4, seed3);
        const trajectory = computeTrajectory(dateValue, seed4, seed3);
        const weighted = computeWeightedScore({
          freqMap,
          matrix4x4: matrix4Score,
          matrix3x3: matrix3Score,
          geometry,
          trajectory
        });

        renderMatrix('matrix4x4', matrix4x4);
        renderMatrix('matrix3x3', matrix3x3);

        const status = document.getElementById('finalStatus');
        if (status) {
          status.innerHTML = `
            <div><strong>Seed 4x4:</strong> ${seed4}</div>
            <div><strong>Seed 3x3:</strong> ${seed3}</div>
            <div><strong>Top digit:</strong> ${weighted.topDigit}</div>
            <div><strong>Matrix 4x4:</strong> ${matrix4Score}</div>
            <div><strong>Matrix 3x3:</strong> ${matrix3Score}</div>
            <div><strong>Geometry:</strong> ${geometry.label}</div>
            <div><strong>Trajectory:</strong> ${trajectory.label}</div>
            <div><strong>Weighted rank:</strong> ${weighted.label}</div>
            <div><strong>Score:</strong> ${weighted.score.toFixed(2)}</div>
          `;
        }

        const finalCandidate = document.getElementById('finalCandidate');
        if (finalCandidate) {
          finalCandidate.textContent = `${seed4} / ${seed3}`;
        }
      }

      function setDefaultDates() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;
      }

      document.addEventListener('DOMContentLoaded', () => {
        setDefaultDates();

        const generateBtn = document.getElementById('generateBtn');
        if (generateBtn) {
          generateBtn.addEventListener('click', renderProtocol);
        }

        const startDate = document.getElementById('startDate');
        if (startDate) {
          startDate.addEventListener('change', renderProtocol);
        }

        renderProtocol();
      });
    </script>
  </body>
</html>
