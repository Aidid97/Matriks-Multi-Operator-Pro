<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matrix Protocol Engine</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --line: #374151;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --blue: #60a5fa;
      --green: #34d399;
      --gold: #fbbf24;
      --red: #f87171;
      --purple: #c084fc;
      --soft: #dbeafe;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #0b1220, #111827);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .date-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .date-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
    }

    .date-box label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .date-box input {
      background: #0b1220;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    .button {
      border: none;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .button:hover { transform: translateY(-1px); opacity: 0.96; }
    .button:active { transform: translateY(0); }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }

    .panel-header {
      background: #0b1220;
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .matrix {
      display: grid;
      gap: 8px;
      padding: 14px;
    }

    .matrix-4x4 { grid-template-columns: repeat(4, minmax(100px, 1fr)); }
    .matrix-3x3 { grid-template-columns: repeat(3, minmax(100px, 1fr)); }

    .cell {
      min-height: 78px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #111827, #0f172a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      gap: 4px;
      color: var(--text);
    }

    .tag {
      font-size: 0.54rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .word {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.05em;
    }

    .status-bar {
      margin-top: 18px;
      background: #0b1220;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 120px;
    }

    .status-title {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .final-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--green);
      line-height: 1.6;
      word-wrap: break-word;
    }

    @media (max-width: 760px) {
      .content { grid-template-columns: 1fr; }
      .matrix-4x4, .matrix-3x3 { grid-template-columns: repeat(2, minmax(110px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">PROTOKOL ANALISIS MATRIK</div>

      <div class="date-row">
        <div class="date-box">
          <label for="startDate">Tarikh Mula</label>
          <input id="startDate" type="date" />
        </div>

        <div class="date-box">
          <label for="endDate">Tarikh Tamat</label>
          <input id="endDate" type="date" />
        </div>

        <button class="button" id="generateBtn">Generate</button>
      </div>
    </div>

    <div class="content">
      <div class="panel">
        <div class="panel-header">Carta Matrix 4x4</div>
        <div class="matrix matrix-4x4" id="matrix4x4"></div>
      </div>

      <div class="panel">
        <div class="panel-header">Carta Matrix 3x3</div>
        <div class="matrix matrix-3x3" id="matrix3x3"></div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-title">Status Protokol</div>
      <div class="final-text" id="finalStatus">Menunggu analisis...</div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
