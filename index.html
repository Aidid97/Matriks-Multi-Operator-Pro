<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Formula Terarah 2D & 3D</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            margin: auto;
        }
        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        input[type="number"], input[type="date"], button {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-jana {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            padding: 12px;
        }
        .btn-jana:hover {
            background-color: #218838;
        }
        .btn-reset {
            background-color: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
            padding: 8px;
            font-size: 14px;
        }
        .btn-reset:hover {
            background-color: #c82333;
        }
        .result-box {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin-top: 15px;
            text-align: left;
        }
        .result-box h4 {
            margin: 0 0 8px 0;
            color: #007bff;
            font-size: 15px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 4px;
        }
        .result-item {
            font-size: 24px;
            font-weight: bold;
            color: #d9534f;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .kaunter-teks {
            margin-top: 15px; 
            font-size: 14px; 
            font-weight: bold; 
            color: #555;
            padding: 5px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .statistik {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
            font-size: 13px;
        }
        .statistik h4 {
            margin-top: 0;
            margin-bottom: 8px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 4px;
        }
        .statistik ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .statistik li {
            padding: 4px 0;
            border-bottom: 1px dashed #ccc;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Penjana Formula Terarah 2D & 3D</h2>
        
        <!-- Kotak Input Asas 3D -->
        <label for="inputAsas3D">Masukkan Asas 3D (Cth: 615):</label>
        <input type="number" id="inputAsas3D" placeholder="Cth: 615" min="0">

        <!-- Kotak Input Asas 2D -->
        <label for="inputAsas2D">Masukkan Asas 2D (Cth: 68):</label>
        <input type="number" id="inputAsas2D" placeholder="Cth: 68" min="0">

        <!-- Kotak Tarikh Cabutan -->
        <label for="inputDate">Masukkan Tarikh Cabutan (Pilihan):</label>
        <input type="date" id="inputDate">
        
        <button class="btn-jana" onclick="janaFormulaTepat()">Jana Keputusan Formula!</button>
        
        <!-- Paparan Keputusan Terarah -->
        <div class="result-box">
            <h4>Hasil Formula 3D:</h4>
            <div class="result-item" id="result3D">-</div>
            <div style="font-size: 12px; color: #666;" id="mirror3D">Cermin: -</div>
        </div>

        <div class="result-box">
            <h4>Hasil Formula 2D:</h4>
            <div class="result-item" id="result2D">-</div>
            <div style="font-size: 12px; color: #666;" id="mirror2D">Cermin: -</div>
        </div>
        
        <p class="kaunter-teks">
            Jumlah Jana: <span id="kaunterPaparan" style="color: #007bff;">0</span> kali
        </p>
        <button class="btn-reset" onclick="resetData()">Kosongkan Rekod</button>

        <!-- Bahagian Rekod Statistik -->
        <div class="statistik">
            <h4>Rekod Kekerapan Keputusan:</h4>
            <ul id="senaraiStatistik">
                <li style='color:#777; justify-content:center; border:none;'>Belum ada rekod.</li>
            </ul>
        </div>
    </div>

    <script>
        let jumlahKiraan = 0;
        let rekodNombor = {};

        // Formula cermin rasmi (0=5, 1=6, 2=7, 3=8, 4=9)
        function getMirror(str) {
            const mirrors = {
                '0': '5', '1': '6', '2': '7', '3': '8', '4': '9',
                '5': '0', '6': '1', '7': '2', '8': '3', '9': '4'
            };
            return str.split('').map(digit => mirrors[digit] || digit).join('');
        }

        function resetData() {
            jumlahKiraan = 0;
            rekodNombor = {};
            document.getElementById("kaunterPaparan").innerText = jumlahKiraan;
            document.getElementById("result3D").innerText = "-";
            document.getElementById("mirror3D").innerText = "Cermin: -";
            document.getElementById("result2D").innerText = "-";
            document.getElementById("mirror2D").innerText = "Cermin: -";
            document.getElementById("senaraiStatistik").innerHTML = "<li style='color:#777; justify-content:center; border:none;'>Belum ada rekod.</li>";
        }

        function janaFormulaTepat() {
            let val3D = document.getElementById('inputAsas3D').value.trim();
            let val2D = document.getElementById('inputAsas2D').value.trim();
            let dateInput = document.getElementById('inputDate').value;

            if (!val3D && !val2D) {
                alert("Sila masukkan sekurang-kurangnya Asas 3D atau Asas 2D!");
                return;
            }

            let infoTarikh = dateInput ? ` (Tarikh: ${dateInput})` : "";

            // Pemprosesan terarah mengikut formula kotak asas (bukan rawak)
            if (val3D) {
                let cermin3D = getMirror(val3D);
                document.getElementById('result3D').innerText = val3D;
                document.getElementById('mirror3D').innerText = "Cermin: " + cermin3D;
                kemaskiniStatistikGabung("3D: " + val3D + " | C: " + cermin3D + infoTarikh);
            } else {
                document.getElementById('result3D').innerText = "-";
                document.getElementById('mirror3D').innerText = "Cermin: -";
            }

            if (val2D) {
                let cermin2D = getMirror(val2D);
                document.getElementById('result2D').innerText = val2D;
                document.getElementById('mirror2D').innerText = "Cermin: " + cermin2D;
                kemaskiniStatistikGabung("2D: " + val2D + " | C: " + cermin2D + infoTarikh);
            } else {
                document.getElementById('result2D').innerText = "-";
                document.getElementById('mirror2D').innerText = "Cermin: -";
            }

            jumlahKiraan++;
            document.getElementById("kaunterPaparan").innerText = jumlahKiraan;
        }

        function kemaskiniStatistikGabung(teks) {
            let senarai = document.getElementById("senaraiStatistik");
            if (rekodNombor[teks]) {
                rekodNombor[teks]++;
            } else {
                rekodNombor[teks] = 1;
            }

            senarai.innerHTML = "";
            for (let item in rekodNombor) {
                let li = document.createElement("li");
                li.innerHTML = `<span style="font-weight:bold; color:#d9534f;">${item}</span> <span>${rekodNombor[item]} kali</span>`;
                senarai.appendChild(li);
            }
        }
    </script>

    <!-- Kod Iklan Adsterra (Social Bar) - Dikekalkan -->
    <script data-cfasync="false" src="https://bauval.org/14/8ed7ff2149891600bc1774052ca193b4"></script>

</body>
</html>
