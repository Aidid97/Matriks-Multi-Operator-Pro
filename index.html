<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Matriks 2D & 3D</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #3498db;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e8f4f8;
            border-left: 4px solid #2980b9;
            border-radius: 4px;
        }
        .number-tag {
            display: inline-block;
            background: #2c3e50;
            color: #fff;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Enjin Analisis Matriks 2D/3D</h2>
    
    <div class="input-group">
        <label for="num1">Nombor Asas 1 (Cth: Draw No 437 atau 4D):</label>
        <input type="number" id="num1" placeholder="Masukkan 3D atau 4D" required>
    </div>
    
    <div class="input-group">
        <label for="num2">Nombor Asas 2 (Cth: 983 atau 8049):</label>
        <input type="number" id="num2" placeholder="Masukkan 3D atau 4D" required>
    </div>
    
    <button onclick="janaKeputusan()">Jana Unjuran Matriks</button>

    <div id="hasil" style="display: none;">
        <div class="result-box">
            <p><strong>Kunci Matriks Utama:</strong> <span id="master-key" style="color:#e74c3c; font-weight:bold; font-size:18px;"></span></p>
        </div>
        
        <div class="result-box">
            <p><strong>Unjuran 2D Kukuh:</strong></p>
            <div id="output-2d"></div>
        </div>

        <div class="result-box">
            <p><strong>Unjuran 3D Kukuh:</strong></p>
            <div id="output-3d"></div>
        </div>
    </div>
</div>

<script>
    function janaKeputusan() {
        const str1 = document.getElementById('num1').value;
        const str2 = document.getElementById('num2').value;

        if (!str1 || !str2) {
            alert("Sila masukkan kedua-dua nombor asas.");
            return;
        }

        // 1. Penguraian Akar (Root Decomposition)
        const sum1 = str1.split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
        const sum2 = str2.split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);

        // 2. Pemecahan Nilai & Penjanaan Kod Pengunci (Modifiers)
        const kodTambah = sum1 + sum2;
        const kodTolak = Math.abs(sum1 - sum2);

        // 3. Mengumpulkan Kunci Matriks (Membuang nombor berulang)
        const rawKeys = str1 + str2 + sum1.toString() + sum2.toString() + kodTambah.toString() + kodTolak.toString();
        // Dapatkan hanya digit unik
        let masterKeys = [...new Set(rawKeys.split(''))].filter(x => !isNaN(x)).sort();

        // Jika kunci terlalu banyak, hadkan kepada 5 digit dominan sahaja untuk elak lambakan
        if (masterKeys.length > 5) {
            masterKeys = masterKeys.slice(0, 5);
        }

        document.getElementById('master-key').innerText = masterKeys.join(' - ');

        // 4. Penjanaan Unjuran 2D Kukuh
        let result2D = [];
        for (let i = 0; i < masterKeys.length; i++) {
            for (let j = 0; j < masterKeys.length; j++) {
                if (i !== j) {
                    result2D.push(masterKeys[i] + masterKeys[j]);
                }
            }
        }
        // Ambil 8 kombinasi 2D teratas
        result2D = result2D.slice(0, 8);
        document.getElementById('output-2d').innerHTML = result2D.map(num => `<span class="number-tag">${num}</span>`).join('');

        // 5. Penjanaan Unjuran 3D Kukuh
        let result3D = [];
        for (let i = 0; i < masterKeys.length; i++) {
            for (let j = 0; j < masterKeys.length; j++) {
                for (let k = 0; k < masterKeys.length; k++) {
                    if (i !== j && j !== k && i !== k) {
                        result3D.push(masterKeys[i] + masterKeys[j] + masterKeys[k]);
                    }
                }
            }
        }
        // Ambil 8 kombinasi 3D teratas
        result3D = result3D.slice(0, 8);
        document.getElementById('output-3d').innerHTML = result3D.map(num => `<span class="number-tag">${num}</span>`).join('');

        // Tunjukkan bahagian hasil
        document.getElementById('hasil').style.display = 'block';
    }
</script>

</body>
</html>
